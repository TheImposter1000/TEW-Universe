name: Windows Pull Request Validation

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/windows-pr-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run annual tournament calendar checks
        run: dotnet run --project tests/AnnualTournamentCalendar.Tests/AnnualTournamentCalendar.Tests.csproj --configuration Release
      - name: Check editable dropdown templates
        run: dotnet run --project tests/DropdownTemplate.Tests/DropdownTemplate.Tests.csproj --configuration Release
      - name: Validate employment and chemistry record names
        run: dotnet run --project tests/RecordNaming.Tests/RecordNaming.Tests.csproj --configuration Release
      - name: Compile TEW Universe desktop
        run: dotnet build src/TEWUniverse.Desktop/TEWUniverse.Desktop.csproj --configuration Release
