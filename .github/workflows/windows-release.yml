name: Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Avoid publishing multiple competing "latest" releases during rapid development.
concurrency:
  group: tew-universe-windows-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Publish desktop editor
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Desktop/TEWUniverse.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app

      - name: Publish separate update agent
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Updater/TEWUniverse.Updater.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/updater

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler was not found" }
          & $compiler "installer\TEWUniverse.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }

      - name: Generate checksum
        shell: pwsh
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $path = Join-Path "publish/installer" $filename
          if (!(Test-Path $path)) { throw "Installer missing: $path" }
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Set-Content -Path "$path.sha256" -Encoding ascii -Value "$hash  $filename"

      - name: Upload installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tew-universe-windows
          path: |
            publish/installer/*.exe
            publish/installer/*.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $notes = @"
          TEW Universe Studio - Experimental Windows Update

          FIX: Existing worker contracts now recognize unsaved edits as soon as fields change. Workers > Contracts supports the main Save Changes button as well as Save Selected Contract, with a changed-field count. Yes/No terms use true/false dropdowns; dates and numeric terms are compared by value instead of text formatting. Successful updates keep the same worker and contract selected.

          FIX: Saving worker profiles or contracts no longer clears roster search text, sort order, age ranges, or active, gender, company, role, nationality, region, and portrait filters. Filter selections are preserved by database key when the roster index refreshes. New contract creation updates the company-filter data without resetting the user's choices.

          PREVIOUS FEATURES: 403 verified numeric mappings including 57 named worker attributes, optional backups for Relationships/Contract creation, full Singles/Tag Team/Trios championship histories, independent historical NPCs, TXT/CSV name import and dual-purpose ring-name alias fields.

          IMPORTANT: Experimental unsigned Windows installer. Windows build and regression tests passed, but live TEW IX MDB contract and lineage writes have not been verified by the game's Data Check. Work on a disposable COPY of your scenario, make backups before important operations and verify with TEW IX Data Check. Destructive full-history replacement requires a backup and confirmation.

          No game database or saved data is included.
          "@
          gh release create $env:RELEASE_TAG "publish/installer/$filename" "publish/installer/$filename.sha256" --title "TEW Universe Studio $env:APP_VERSION" --notes $notes --latest
