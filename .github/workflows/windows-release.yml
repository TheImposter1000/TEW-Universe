name: Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Avoid publishing multiple competing "latest" releases during rapid development.
concurrency:
  group: tew-universe-windows-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate database and Data Check rules
        run: dotnet run --project tests/AnnualTournamentCalendar.Tests/AnnualTournamentCalendar.Tests.csproj --configuration Release

      - name: Validate editable dropdown templates
        run: dotnet run --project tests/DropdownTemplate.Tests/DropdownTemplate.Tests.csproj --configuration Release

      - name: Set version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Publish desktop editor
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Desktop/TEWUniverse.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app

      - name: Publish separate update agent
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Updater/TEWUniverse.Updater.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/updater

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler was not found" }
          & $compiler "installer\TEWUniverse.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }

      - name: Generate checksum
        shell: pwsh
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $path = Join-Path "publish/installer" $filename
          if (!(Test-Path $path)) { throw "Installer missing: $path" }
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Set-Content -Path "$path.sha256" -Encoding ascii -Value "$hash  $filename"

      - name: Upload installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tew-universe-windows
          path: |
            publish/installer/*.exe
            publish/installer/*.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $notes = @"
          TEW Universe Studio - Experimental Windows Update

          FIX: Titles > Advanced Generator now separates the editable Builder from a full-height Generated History Preview. The 437-pixel nested-scroll layout has been removed, the champion candidates grid has more vertical space, and Generate, Import, and Export controls remain visible. Previews automatically open in the dedicated review view; edits invalidate outdated previews and switching championships resets the builder scroll position.

          FIX: Safe historical title-team replacements support linked workers paired with named historical NPCs. Partner name fields now sit beside the correct wrestler selectors. Previously linked reigns remain untouched.

          FIX: Championship History imports, including destructive full rebuilds and individual historical reign edits, no longer require a preexisting manual backup. Yes / No / Cancel offers a backup before the confirmed write, with No continuing without a backup. No database backup is created silently.

          FIX: Both title-history generators now estimate successful defenses from the actual days held and title-specific booking frequency, including Television, Touring, Regular, Occasional, and Special Attraction presets. Automatic detects Television/TV (roughly every 2-5 days) and World/Heavyweight/Universal (roughly every 3-6 days) titles. Preview data reflects varied defense rates instead of assigning 3-15 defenses to year-long reigns; annual Cup defenses are still -1.

          FIX: World and company year-end awards now recognize the actual winner fields (MaleOverall, FemaleOverall, MaleTag1, FemaleTag2, etc.) as searchable worker selections. The Create New Award Year action has a dedicated recipient dialog, clears old winners by default, and never changes the source record. Non-recipient database metadata remains protected.

          FIX: Workers > Accomplishments now groups title reigns by company, shows concise title counts with optional capture dates, and lists readable global and company award achievements in an Awards & Other Accomplishments section.

          FIX: Studio Tools > Data Check now verifies BOTH global and company award recipients, detects missing promotion/worker links, duplicate world award years, repeated company award records needing review, and duplicate award tag partners. Missing required table columns report Unavailable instead of silently passing. Biographical title counts require an explicit number directly tied to a championship name, reducing false positives. Findings can be copied, and valid worker findings can open the worker profile. Findings are cleared when changing databases. The check is read-only and not a substitute for TEW IX's own Data Check.

          IMPORTANT: Experimental unsigned installer. Windows compilation and regression checks pass. New award creation and editing must be tested on a disposable TEW IX scenario COPY with the game's Data Check, as actual in-game MDB write compatibility has not yet been verified. Do not edit the same MDB concurrently in TEW IX.

          No game database, saves or private files are included in the installer.
          "@
          gh release create $env:RELEASE_TAG "publish/installer/$filename" "publish/installer/$filename.sha256" --title "TEW Universe Studio $env:APP_VERSION" --notes $notes --latest
