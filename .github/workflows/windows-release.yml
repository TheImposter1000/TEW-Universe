name: Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Avoid publishing multiple competing "latest" releases during rapid development.
concurrency:
  group: tew-universe-windows-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Publish desktop editor
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Desktop/TEWUniverse.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app

      - name: Publish separate update agent
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Updater/TEWUniverse.Updater.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/updater

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler was not found" }
          & $compiler "installer\TEWUniverse.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }

      - name: Generate checksum
        shell: pwsh
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $path = Join-Path "publish/installer" $filename
          if (!(Test-Path $path)) { throw "Installer missing: $path" }
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Set-Content -Path "$path.sha256" -Encoding ascii -Value "$hash  $filename"

      - name: Upload installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tew-universe-windows
          path: |
            publish/installer/*.exe
            publish/installer/*.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $notes = @"
          TEW Universe Studio - Experimental Windows Update

          NEW: Awards replaces the unused History navigation item. Browse world year-end awards (tblEOYAward) and company-specific awards (tblEOYFedAward) in two searchable views. Read actual MDB values and resolve known winner IDs to worker/company names.

          NEW: Limited editing of existing award records. Year fields and recognizable world year-end award worker/company winner IDs can be updated after confirmation. Unverified award fields, company-specific winner codes, and new award-year INSERTs are intentionally read-only until their complete schemas are verified. Writes validate referenced IDs, preserve the rest of the record, and are transactional.

          PREVIOUS: Contracts recognize all pending changes, and saving workers/contracts preserves roster search, sorting and selected filters. Earlier updates added 403 verified numeric mappings, championship/tag-team/trios history generation, name-only NPCs and Relationships.

          IMPORTANT: This is an experimental unsigned Windows installer. CI build and regression tests passed; TEW IX has not validated new Awards write operations. Use a COPY of your .mdb, create a backup before important edits, and run TEW IX Data Check before trusting any change. There is no automatic data migration.

          No game database or scenario data is distributed.
          "@
          gh release create $env:RELEASE_TAG "publish/installer/$filename" "publish/installer/$filename.sha256" --title "TEW Universe Studio $env:APP_VERSION" --notes $notes --latest
