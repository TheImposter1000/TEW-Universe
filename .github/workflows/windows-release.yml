name: Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Avoid publishing multiple competing "latest" releases during rapid development.
concurrency:
  group: tew-universe-windows-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Publish desktop editor
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Desktop/TEWUniverse.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app

      - name: Publish separate update agent
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Updater/TEWUniverse.Updater.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/updater

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler was not found" }
          & $compiler "installer\TEWUniverse.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }

      - name: Generate checksum
        shell: pwsh
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $path = Join-Path "publish/installer" $filename
          if (!(Test-Path $path)) { throw "Installer missing: $path" }
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Set-Content -Path "$path.sha256" -Encoding ascii -Value "$hash  $filename"

      - name: Upload installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tew-universe-windows
          path: |
            publish/installer/*.exe
            publish/installer/*.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $notes = @"
          TEW Universe Studio - Experimental Windows Update

          NEW: Relationships editor. Browse, filter, create, edit and remove worker relationships, using 23 newly verified zero-based TEW IX code labels: personal (P_Rel 0-8), romantic (R_Rel 0-6) and family (F_Rel 0-6). Mentor remains Yes/No. Total mappings: 346 verified codes across 13 categories.

          NEW: Advanced Championship History Generator now supports complete Tag Team and Trios histories (two or three individual holders per reign), including linked workers, name-only NPCs and combinations of both. Full-history previews, employment checks and CSV export cover every holder position.

          NEW: Add Name-Only and Import Name List in the Advanced Generator. Type historical champions directly or paste/load TXT/CSV name lists for Singles, Tag Team and Trios. These name-only holders use ID -1 and do not become roster workers.

          PREVIOUSLY ADDED: Template-based contract creation and historical championship lineage editing, including name-only NPC champions.

          IMPORTANT: This is an EXPERIMENTAL Windows update. GitHub Windows build and regression checks passed, but new relationship and full-lineage database write operations have NOT been verified by running TEW IX. Always use a disposable COPY of your TEW IX database, create a manual backup before making changes, and run TEW IX Data Check before trusting the results. A full-history rebuild deletes/replaces the selected title's previous lineage after explicit confirmation. Do not use the new write features on an irreplaceable live scenario until validated in-game.

          Body Shape labels remain unmapped pending verification of stored 0-7 values vs supplied 1-8 descriptions. Installer is unsigned and contains no game database, scenario or password.
          "@
          gh release create $env:RELEASE_TAG "publish/installer/$filename" "publish/installer/$filename.sha256" --title "TEW Universe Studio $env:APP_VERSION" --notes $notes --latest
