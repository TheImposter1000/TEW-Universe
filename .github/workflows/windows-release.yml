name: Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Avoid publishing multiple competing "latest" releases during rapid development.
concurrency:
  group: tew-universe-windows-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate database and Data Check rules
        run: dotnet run --project tests/AnnualTournamentCalendar.Tests/AnnualTournamentCalendar.Tests.csproj --configuration Release

      - name: Validate editable dropdown templates
        run: dotnet run --project tests/DropdownTemplate.Tests/DropdownTemplate.Tests.csproj --configuration Release

      - name: Set version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Publish desktop editor
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Desktop/TEWUniverse.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app

      - name: Publish separate update agent
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Updater/TEWUniverse.Updater.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/updater

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler was not found" }
          & $compiler "installer\TEWUniverse.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }

      - name: Generate checksum
        shell: pwsh
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $path = Join-Path "publish/installer" $filename
          if (!(Test-Path $path)) { throw "Installer missing: $path" }
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Set-Content -Path "$path.sha256" -Encoding ascii -Value "$hash  $filename"

      - name: Upload installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tew-universe-windows
          path: |
            publish/installer/*.exe
            publish/installer/*.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $notes = @"
          TEW Universe Studio - Experimental Windows Update

          FIX: Historical employment RecordNames now use DNA (2022 -?) for ongoing positions and NCW (2016-2020) for completed jobs. No #2 suffix is generated automatically. Conflicting names must be edited manually; batch repair skips collisions with warnings.

          FIX: TEW IX 01/01/1666 ongoing end dates are recognized. Employment History accepts and saves the 1666 Until code for still-active stints, displays Ongoing, and offers a Still active shortcut. Generated and repaired RecordNames show INITIALS (YYYY -?), not YYYY-1666. Company closing-date sentinel remains an active-company marker; ongoing employment correctly covers finite title reigns. Start/formed dates and tournament title loss sentinels keep their own semantics.

          FIX: Employment History Generate name no longer presents an unhelpful generic date/initials popup. Missing or invalid initials, From and Until dates, out-of-range years and reversed date ranges are identified inline with focus on the field that needs attention. The generated name remains INITIALS (YYYY-YYYY), with no missing dates guessed. Selected companies with stored initials can populate a blank initials entry.

          IMPROVED: Employment History Company and Historical company initials now sync both ways. Selecting a company fills its verified tblFed initials even if the field is already populated; typing unique initials selects the matching company automatically. Unknown, partial, and ambiguous initials cannot silently save against an unrelated company. Existing historical data is not changed simply by opening a period.

          NEW: Chemistry is a standalone editor for TEW IX tblChemistryForce presets, with searchable worker pairs, actual stored type/quality codes, and verified insert, edit and delete actions. Unknown enum meanings are not guessed; new codes must already exist in the scenario. Worker references, duplicate pair/type detection, transactional saves, confirmations and optional backups are preserved. Tools has been removed from visible navigation; its diagnostic engine remains dormant.

          NEW: Editable date fields now accept both US numeric dates and English written dates. For example, 5/12/1998, 05/12/1998, May 12th 1998 and May 12, 1998 all mean the same day. Ordinal suffixes are validated, stored values remain native MDB dates, and display/CSV exports retain MM/DD/YYYY. Employment history, contracts, tag-team formation, championship history imports and title timeline limits follow the same parsing rule.

          FIX: Database writes treat backups as optional. Create Tag Team no longer blocks without an existing manual backup, and Record Name Repair offers Yes (back up), No (continue without a backup), or Cancel (stop). Failed or canceled backups do not count as previously saved snapshots; confirmations, transactions and MDB validation are unchanged.

          FIX: Newly created company year-end award Recordnames use actual promotion initials plus year (for example DNA 2022), rather than full promotion names or generated numeric codes. World award identifiers remain separate.

          NEW: Record CSV import and export now share a consistent main toolbar workflow across Companies, Championships (details), Tag Teams, Events, Stables, World/Company Year-End Awards, and Relationships. An export includes section identity, record UID, field types, original values and protected-field flags; import previews changes and rejects different sections, stale records or protected keys. Section-specific validation and save behavior remain in control, with optional backup. New registered record-backed editor sections inherit the CSV workflow; Workers remain excluded. Tools retains its Data Check report CSV export without edit/import. Championship lineage has its separate specialized CSV import/export.

          NEW: Companies now supports company-scoped CSV import and export, including verified one-record related settings. Exported CSV rows preserve company UID, record UID and original-value snapshots; imports validate those identities and protected fields, preview every change and require explicit confirmation, with backup optional. The Companies editor now has a searchable Current Roster section linked through actual tblContract.FedUID to existing workers, with worker navigation and a separate roster CSV export. Company imports do not change workers or contracts.

          FIX: Company-aware title histories now use the actual full tblFed.CompanyOpening and CompanyClosing dates, including the day, rather than guessing OpenYear/OpenMonth and ClosedYear/ClosedMonth. The original and advanced generators both support choosing the historical company when belt OriginalFed is unassigned; Advanced's company selector supplies both date limits and employment checks. HCW closing March 28, 2020 now caps a requested 2007-2021 title history on March 28, 2020. Missing company links prompt for selection instead of silently ignoring constraints. Date guidance and effective generation period update live.

          NEW: The Companies editor now displays the complete tblFed schema, grouping identity, history, finances, geographic information, product and personnel settings. It also loads verified FedUID-linked popularity, company biography, style, hiring, backstage, touring, power, schedule, brand and department records. Verified one-row scalar fields are editable in an atomic transaction with the main company fields; primary IDs and unverified references are protected, and multi-row relationships are visible in read-only grids. Field coverage and safe editing are schema-derived rather than hidden behind the previous 14-field allowlist.

          NEW: Scenario Start is now editable from the toolbar and updates TEW IX tblInfo.StartMonth / StartYear after confirmation. The game-wide start month supplies an absolute pre-game history cutoff. Company's OpenMonth/OpenYear and ClosedMonth/ClosedYear fields are now editable with validation in Companies and automatically constrain new title histories via tblBelt.OriginalFed. Both generators support an exact optional final date and a company-dates override. A company closing in November 2021 will end generated reigns by November 30, not December 31. No previous history is rewritten automatically.

          NEW: Championship history CSV import is available in Title Lineage and Advanced Generator. Studio's original 9-column, advanced 11-column and targeted 12-column exported CSV files open into the existing full-height preview. No import runs automatically. Validation checks BeltUID, actual workers, name-only NPC partners, chronology, title type and exact saved UID/dates for targeted replacements. Full-history CSVs rebuild one title with newly allocated reign record IDs; targeted CSVs preserve historical UIDs, dates and defenses. Both import paths require explicit confirmation; backups remain optional. Arbitrary external CSV schemas are not supported.

          FIX: Titles > Advanced Generator now separates the editable Builder from a full-height Generated History Preview. The 437-pixel nested-scroll layout has been removed, the champion candidates grid has more vertical space, and Generate, Import, and Export controls remain visible. Previews automatically open in the dedicated review view; edits invalidate outdated previews and switching championships resets the builder scroll position.

          FIX: Safe historical title-team replacements support linked workers paired with named historical NPCs. Partner name fields now sit beside the correct wrestler selectors. Previously linked reigns remain untouched.

          FIX: Championship History imports, including destructive full rebuilds and individual historical reign edits, no longer require a preexisting manual backup. Yes / No / Cancel offers a backup before the confirmed write, with No continuing without a backup. No database backup is created silently.

          FIX: Both title-history generators now estimate successful defenses from the actual days held and title-specific booking frequency, including Television, Touring, Regular, Occasional, and Special Attraction presets. Automatic detects Television/TV (roughly every 2-5 days) and World/Heavyweight/Universal (roughly every 3-6 days) titles. Preview data reflects varied defense rates instead of assigning 3-15 defenses to year-long reigns; annual Cup defenses are still -1.

          FIX: World and company year-end awards now recognize the actual winner fields (MaleOverall, FemaleOverall, MaleTag1, FemaleTag2, etc.) as searchable worker selections. The Create New Award Year action has a dedicated recipient dialog, clears old winners by default, and never changes the source record. Non-recipient database metadata remains protected.

          FIX: Workers > Accomplishments now groups title reigns by company, shows concise title counts with optional capture dates, and lists readable global and company award achievements in an Awards & Other Accomplishments section.

          FIX: Studio Tools > Data Check now verifies BOTH global and company award recipients, detects missing promotion/worker links, duplicate world award years, repeated company award records needing review, and duplicate award tag partners. Missing required table columns report Unavailable instead of silently passing. Biographical title counts require an explicit number directly tied to a championship name, reducing false positives. Findings can be copied, and valid worker findings can open the worker profile. Findings are cleared when changing databases. The check is read-only and not a substitute for TEW IX's own Data Check.

          IMPORTANT: Experimental unsigned installer. Windows compilation and regression checks pass. New award creation and editing must be tested on a disposable TEW IX scenario COPY with the game's Data Check, as actual in-game MDB write compatibility has not yet been verified. Do not edit the same MDB concurrently in TEW IX.

          FIX: Historical title-lineage champion editing no longer rejects existing ordinary championship reigns whose Defences value is -1 (unknown/not recorded). The selected reign's dates, defenses, UID and order remain untouched when changing holders. New reigns accept -1 or a nonnegative defence count; invalid dates and counts below -1 remain blocked.

          FIX: The historical champion editor explains whether the original holder was a name-only NPC (UID -1) or a linked wrestler. Final confirmation explicitly lists target worker IDs/NPC status and warns about any linked worker UID changes, preventing accidental attribution of historical NPC reigns to roster wrestlers.

          No game database, saves or private files are included in the installer.
          "@
          gh release create $env:RELEASE_TAG "publish/installer/$filename" "publish/installer/$filename.sha256" --title "TEW Universe Studio $env:APP_VERSION" --notes $notes --latest
