name: Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Avoid publishing multiple competing "latest" releases during rapid development.
concurrency:
  group: tew-universe-windows-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Publish desktop editor
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Desktop/TEWUniverse.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app

      - name: Publish separate update agent
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Updater/TEWUniverse.Updater.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/updater

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler was not found" }
          & $compiler "installer\TEWUniverse.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }

      - name: Generate checksum
        shell: pwsh
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $path = Join-Path "publish/installer" $filename
          if (!(Test-Path $path)) { throw "Installer missing: $path" }
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Set-Content -Path "$path.sha256" -Encoding ascii -Value "$hash  $filename"

      - name: Upload installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tew-universe-windows
          path: |
            publish/installer/*.exe
            publish/installer/*.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $notes = @"
          TEW Universe Studio - Windows Update

          NEW: Workers > Accomplishments tab. Independently curate championship achievements, award wins, tournaments, Hall of Fame inductions, milestones, and other career achievements with optional years and detailed notes. Add, edit and remove entries by worker.

          IMPORTANT: Accomplishments are saved only in separate Studio-managed JSON files under your local application data directory, keyed by the selected scenario path and worker UID. This feature does NOT write to the TEW IX MDB, invent championship reigns or update official awards. Back up the companion JSON folder independently; moving a database to a different path does not automatically move its local achievements.

          PREVIOUS: Read-only Tools Data Check scans award, tag-team, title-lineage and biography links, filters findings by severity and exports CSV. Awards now browses actual world/company year-end records. Contract saves retain worker filters.

          This Windows installer is unsigned. Automated builds and regression checks pass; for any TEW IX MDB-editing features, work on a COPY and use the game's Data Check. The Accomplishments feature itself leaves MDB bytes untouched.

          No TEW IX game database or scenario data is included.
          "@
          gh release create $env:RELEASE_TAG "publish/installer/$filename" "publish/installer/$filename.sha256" --title "TEW Universe Studio $env:APP_VERSION" --notes $notes --latest
