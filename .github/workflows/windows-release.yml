name: Windows Desktop Installer

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Avoid publishing multiple competing "latest" releases during rapid development.
concurrency:
  group: tew-universe-windows-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set version
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Publish desktop editor
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Desktop/TEWUniverse.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app

      - name: Publish separate update agent
        shell: pwsh
        run: |
          dotnet publish src/TEWUniverse.Updater/TEWUniverse.Updater.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/updater

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler was not found" }
          & $compiler "installer\TEWUniverse.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }

      - name: Generate checksum
        shell: pwsh
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $path = Join-Path "publish/installer" $filename
          if (!(Test-Path $path)) { throw "Installer missing: $path" }
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          Set-Content -Path "$path.sha256" -Encoding ascii -Value "$hash  $filename"

      - name: Upload installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tew-universe-windows
          path: |
            publish/installer/*.exe
            publish/installer/*.sha256

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $filename = "TEW-Universe-Setup-$env:APP_VERSION.exe"
          $notes = @"
          TEW Universe Studio - Experimental Windows Update

          NEW: Verified worker attribute names for 57 actual TEW IX numeric codes: Personality (1-28), Alignment (310-315), Gimmick (320-339), and Other Performance (374-376). Five Personality codes (6, 13, 17, 20, 23) are Unassigned/reserved and cannot be newly assigned. The other 52 codes can be selected by name. Unknown existing attribute codes remain visible and unchanged; original numeric values are always stored. Total verified mappings: 403 across 14 database fields.

          FIX: Worker Attributes can read and write numeric tblAttribute.Attribute columns instead of incorrectly requiring text. Hidden and Permanent flags remain independent. No worker attributes are migrated or removed by installation.

          FIX: Advanced Championship History Generator partner 2 and partner 3 name boxes have two uses. When a real wrestler is selected, the name box is an optional ring-name alias while preserving their worker UID. With no wrestler selected, the box requires a name-only historical NPC in full-history mode. Explicit dynamic labels clarify each mode.

          CHANGE: Relationships and Create Contract From Template now offer optional backup choices (create backup / continue without backup / cancel) instead of requiring a backup. Destructive full-title-history replacement still requires one.

          PREVIOUS FEATURES: Relationships editor; full Singles, Tag Team and Trios championship history generation; name-only NPC champions; TXT/CSV historical name import; contract creation and title lineage edits.

          IMPORTANT: Experimental unsigned Windows installer. Automated Windows builds and regression tests pass; actual Access MDB write compatibility has NOT yet been verified by TEW IX. Work on a disposable COPY of your scenario, consider creating a backup, and use TEW IX Data Check before trusting results. The full-history generator deletes and replaces the selected title's existing historical reigns after confirmation.

          No TEW IX game database, save data or passwords are included. Body Shape code numbering is still awaiting verification.
          "@
          gh release create $env:RELEASE_TAG "publish/installer/$filename" "publish/installer/$filename.sha256" --title "TEW Universe Studio $env:APP_VERSION" --notes $notes --latest
